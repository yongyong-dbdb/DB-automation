name: Apply InnoDB Cluster v1.0.19 password policy diagnostics
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/ic-v1019-password-policy.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh')
          s=p.read_text()
          s=s.replace('# mysql_innodb_cluster_migrate.sh v1.0.18','# mysql_innodb_cluster_migrate.sh v1.0.19',1)
          s=s.replace('VERSION=1.0.18','VERSION=1.0.19',1)
          marker='configure_admin(){\n'
          helper='''password_policy_report(){\n    i=$1\n    log "Current validate_password policy on node $i:"\n    sql "$i" "SHOW VARIABLES LIKE \'validate_password%\';" 2>/dev/null | sed \'s/^/  /\' >&2 || log \'  validate_password variables are unavailable on this server.\'\n    log \'The script does not weaken or change password policy.\'\n}\nadmin_account_presence_report(){\n    u=$1; h=$2; present=\'\'; count=0\n    for i in $(ids); do\n        c=$(sql "$i" "SELECT COUNT(*) FROM mysql.user WHERE User=\'$(q "$u")\' AND Host=\'$(q "$h")\';" 2>/dev/null || printf \'0\')\n        if [ "$c" -gt 0 ]; then present="${present}${present:+ }$i"; count=$((count+1)); fi\n    done\n    total=$(get meta count)\n    if [ "$count" -eq 0 ]; then\n        log "Account state after failure: \'$u\'@\'$h\' was not created on any registered node."\n    elif [ "$count" -eq "$total" ]; then\n        log "Account state after failure: \'$u\'@\'$h\' exists on every registered node. Re-run configure-admin with action=existing after reviewing the account."\n    else\n        log "Account state after failure: \'$u\'@\'$h\' exists only on node(s): $present."\n        log \'Partial account creation detected; review the affected nodes before retrying. The script will not auto-drop or alter the account.\'\n    fi\n}\ncluster_admin_create_fail(){\n    i=$1; out=$2; u=$3; h=$4\n    cat "$out" >&2\n    if grep -Eq \'MYSQLSH 1819|does not satisfy the current policy requirements\' "$out"; then\n        log \'ERROR: clusterAdmin password does not satisfy the server password policy.\'\n        password_policy_report "$i"\n    else\n        log "ERROR: clusterAdmin creation failed on node $i."\n    fi\n    admin_account_presence_report "$u" "$h"\n    exit 1\n}\n\n'''
          if marker not in s: raise SystemExit('configure_admin marker missing')
          s=s.replace(marker,helper+marker,1)
          old1='MYSQL_TEST_LOGIN_FILE="$(get "$i" login_file)" "$MYSQLSH" --login-path="$(get "$i" login_path)" --no-wizard --js -f "$js" >"$out" 2>&1 || { cat "$out" >&2; die "clusterAdmin creation failed on node $i"; }'
          new1='MYSQL_TEST_LOGIN_FILE="$(get "$i" login_file)" "$MYSQLSH" --login-path="$(get "$i" login_path)" --no-wizard --js -f "$js" >"$out" 2>&1 || cluster_admin_create_fail "$i" "$out" "$au" "$ah"'
          old2='cat "$TMP/$i.pw" | "$MYSQLSH" --no-wizard --uri "$uri" --passwords-from-stdin --js -f "$js" >"$out" 2>&1 || { cat "$out" >&2; die "clusterAdmin creation failed on node $i"; }'
          new2='cat "$TMP/$i.pw" | "$MYSQLSH" --no-wizard --uri "$uri" --passwords-from-stdin --js -f "$js" >"$out" 2>&1 || cluster_admin_create_fail "$i" "$out" "$au" "$ah"'
          if old1 not in s or old2 not in s: raise SystemExit('failure handler targets missing')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s)
          PY
          sh -n MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q '^VERSION=1.0.19$' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'MYSQLSH 1819' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          ! grep -Eq 'setenforce[[:space:]]+0|chmod[[:space:]]+777' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
      - name: Commit and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/ic-v1019-password-policy.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'InnoDB Cluster v1.0.19 password policy diagnostics'
          git push origin HEAD:main
