name: Apply exact InnoDB Cluster v1.0.26
on:
  push:
    paths:
      - '.github/workflows/ic-v1026-apply.yml'
      - '.github/ic-v1026-full.gz.b64'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode and validate exact file
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/ic-v1026-full.gz.b64 | gzip -dc > MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          test "$(sha256sum MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh | awk '{print $1}')" = "0079882fe17a3e683c507afafb260901aca9c1ab1be38182aef57cc73230d2e8"
          sh -n MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'v1.0.26' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'detect_login_paths' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'auth_default=login-path' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
      - name: Commit product file and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/ic-v1026-full.gz.b64 .github/workflows/ic-v1026-apply.yml .github/workflows/ic-v1026-full.yml
          git add MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh .github/ic-v1026-full.gz.b64 .github/workflows/ic-v1026-apply.yml .github/workflows/ic-v1026-full.yml
          git commit -m 'Apply exact InnoDB Cluster v1.0.26'
          git push origin main
