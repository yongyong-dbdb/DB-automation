name: Apply InnoDB Cluster v1.0.16 admin auth and candidate UX
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ic-v1016-admin-auth.yml'
      - '.tmp/ic-v1016-patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          python3 .tmp/ic-v1016-patch.py
          sh -n MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q '^VERSION=1.0.16$' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'show_existing_admin_candidates' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'recommended_admin_host_pattern' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          ! grep -Eq '(^|[[:space:];|&])(yum|dnf|apt|apt-get|pip|npm)([[:space:]]|$)' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          ! grep -Eq 'setenforce[[:space:]]+0|chmod[[:space:]]+777' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
      - name: Commit result and clean temporary files
        shell: bash
        run: |
          rm -f .tmp/ic-v1016-patch.py .github/workflows/ic-v1016-admin-auth.yml
          rmdir .tmp 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'InnoDB Cluster v1.0.16 admin candidate and mysqlsh login-path fix'
          git push origin HEAD:main
