name: Fix check-only result classification

on:
  push:
    paths:
      - '.github/workflows/fix-check-only-result-classification.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/fix-check-only-result-classification.py
          sh -n "$target"
          git diff --check
      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'EXIT_MANUAL_CHECKS=5' "$target"
          grep -F 'PASSED WITH MANUAL CHECKS' "$target"
          grep -F 'rc=$EXIT_MANUAL_CHECKS' "$target"
          grep -F 'check-only automated blocking checks passed; warnings or manual checks remain' "$target"
          ! grep -F 'check-only has unresolved warnings or manual checks' "$target"
      - name: Mock result-classification policy
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          block=$(awk '/^finalize_result_report\(\) \{/{p=1} /^print_result_summary\(\) \{/{p=0} p' "$target")
          printf '%s\n' "$block" | grep -F 'PASSED WITH MANUAL CHECKS'
          awk '/if \[ "$CHECK_ONLY" -eq 1 \]/{p=1} p{print} /fi/{if(p){exit}}' "$target" | grep -F 'rc=$EXIT_MANUAL_CHECKS'
      - name: Dependency scan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          ! awk '!/^[[:space:]]*#/' "$target" | grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)'
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: distinguish manual checks from validation failures'
          git push origin HEAD:main
