name: GR v1.0.12 candidate regressions
on:
  push:
    branches: [gr-v1.0.12-reprovision]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX shell syntax and forbidden GTID reset check
        shell: bash
        run: |
          set -euo pipefail
          base=MySQL/Group-Replication
          sh -n "$base/mysql_gr_migrate.sh"
          sh -n "$base/reprovision_helper.sh"
          test "$(sh "$base/mysql_gr_migrate.sh" --version)" = 1.0.12
          reset_hits=$(grep -En 'RESET[[:space:]]+(MASTER|BINARY[[:space:]]+LOGS[[:space:]]+AND[[:space:]]+GTIDS)' "$base/mysql_gr_migrate.sh" "$base/reprovision_helper.sh" | grep -v 'Do NOT run' || true)
          test -z "$reset_hits" || { printf '%s\n' "$reset_hits"; exit 1; }
          ! grep -En 'mysqlbinlog[^|]*\|[[:space:]]*mysql([[:space:]]|$)' "$base/mysql_gr_migrate.sh"
      - name: Existing regression suite
        run: python3 MySQL/Group-Replication/test_gr.py
      - name: Candidate safety regression suite
        run: python3 MySQL/Group-Replication/test_gr_safety.py
