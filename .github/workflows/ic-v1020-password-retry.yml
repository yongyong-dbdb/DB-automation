name: Apply InnoDB Cluster v1.0.20 password retry
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/ic-v1020-password-retry.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply validated patch
        shell: bash
        run: |
          git apply --check .github/ic-v1020.patch
          git apply .github/ic-v1020.patch
          sh -n MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q '^VERSION=1.0.20$' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q "Cluster admin password (re-enter)" MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q "Password rejected by the server password policy" MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
      - name: Commit result and cleanup helper files
        shell: bash
        run: |
          rm -f .github/ic-v1020.patch .github/workflows/ic-v1020-password-retry.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'InnoDB Cluster v1.0.20 retry password on policy rejection'
          git push origin HEAD:main
