name: Fix reparent verifier and cascade plan

on:
  push:
    paths:
      - '.github/workflows/fix-reparent-verifier-and-cascade-plan.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/fix-reparent-verifier-and-plan.py
          sh -n "$target"
          git diff --check

      - name: Verify multi-variable psql contract
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'psql_call_var3() {' "$target"
          grep -F 'rcr_count=$(psql_call_var3 app "$rcr_app" client "$rcr_client" slot "$rcr_slot"' "$target"
          ! grep -F 'rcr_count=$(psql_call_var app "$rcr_app" client "$rcr_client" slot "$rcr_slot"' "$target"

      - name: Verify cascade execution plan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'Reparent target          :' "$target"
          grep -F 'Existing upstream       :' "$target"
          grep -F 'New upstream            :' "$target"
          grep -F 'Existing downstreams    :' "$target"
          grep -F 'Cascade preservation     : required' "$target"
          grep -F 'preserve downstream  : application_name=' "$target"
          grep -F 'done 3< "$UNSELECTED_REPARENT_PLAN"' "$target"
          grep -F 'done 4< "$ssep_relations"' "$target"

      - name: Existing safety regressions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          for fn in planned_switchover execute_unselected_reparent_plan remote_repoint_standby remote_count_reparented remote_create_slot psql_call_var psql_call_var3; do
            grep -F "${fn}() {" "$target" >/dev/null
          done
          grep -F "pg_create_physical_replication_slot(:'slot', true, false)" "$target" >/dev/null
          grep -F 'reverse_streaming_verified|topology_verified)' "$target" >/dev/null
          ! grep -E '128\.10\.41\.|133|134|135|136' "$target"
          forbidden='python|python3|jq|yq|expect|perl|node|npm|pip'
          ! grep -E "^[[:space:]]*(${forbidden})([[:space:]]|$)" "$target"
          ! grep -E "(\||;|&&|\|\|)[[:space:]]*(${forbidden})([[:space:]]|$)" "$target"
          ! grep -E "\$\([[:space:]]*(${forbidden})([[:space:]]|$)" "$target"

      - name: Static call-arity regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('PostgreSQL/postgresql_role_switch_v0.1.22.sh').read_text()
          assert 'psql_call_var3 app "$rcr_app" client "$rcr_client" slot "$rcr_slot"' in s
          # The old erroneous multi-pair call through the one-variable helper must never return.
          assert 'psql_call_var app "$rcr_app" client "$rcr_client" slot "$rcr_slot"' not in s
          # Interactive plan display reads metadata on dedicated descriptors only.
          start=s.index('show_switchover_execution_plan() {')
          end=s.index('\nplanned_switchover() {', start)
          block=s[start:end]
          assert 'done 3< "$UNSELECTED_REPARENT_PLAN"' in block
          assert 'done 4< "$ssep_relations"' in block
          print('call arity and cascade plan regression passed')
          PY

      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git commit -m 'fix: verify reparented standbys and show cascade plan'
          git push origin HEAD:main
