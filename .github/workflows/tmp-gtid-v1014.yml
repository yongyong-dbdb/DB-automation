name: Temporary GTID replication v1.0.14 update
on:
  push:
    paths:
      - '.github/tmp_patch_gtid_v1014.py'
      - '.github/workflows/tmp-gtid-v1014.yml'
permissions:
  contents: write
jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/tmp_patch_gtid_v1014.py
      - name: Validate
        run: |
          sh -n 'MySQL/Replication(GTID)/mysql_gtid_replication.sh'
          grep -F 'SCRIPT_VERSION=1.0.14' 'MySQL/Replication(GTID)/mysql_gtid_replication.sh'
          grep -F 'compare_source_replica_gtids()' 'MySQL/Replication(GTID)/mysql_gtid_replication.sh'
          grep -F 'GTID_SUBTRACT' 'MySQL/Replication(GTID)/mysql_gtid_replication.sh'
          ! grep -F 'RESET BINARY LOGS AND GTIDS;' 'MySQL/Replication(GTID)/mysql_gtid_replication.sh'
          ! grep -F 'RESET MASTER;' 'MySQL/Replication(GTID)/mysql_gtid_replication.sh'
          ! grep -F 'RESET REPLICA ALL;' 'MySQL/Replication(GTID)/mysql_gtid_replication.sh'
          ! grep -F 'RESET SLAVE ALL;' 'MySQL/Replication(GTID)/mysql_gtid_replication.sh'
      - name: Commit target and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'MySQL/Replication(GTID)/mysql_gtid_replication.sh'
          git commit -m 'MySQL GTID replication v1.0.14: block destructive GTID reset'
          git rm -f .github/tmp_patch_gtid_v1014.py .github/workflows/tmp-gtid-v1014.yml
          git commit -m 'chore: remove temporary GTID v1.0.14 validation files'
          git push origin main
