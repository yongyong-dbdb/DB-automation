name: Fix PostgreSQL role switch CR guard

on:
  push:
    paths:
      - '.github/patches/trigger-role-switch-cr-guard-*'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair CR and LF guard
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 -c "from pathlib import Path; p=Path('$target'); s=p.read_text(); old=\"    case \\\"\\$rvu_dsn\\\" in\\n        *'\\n'*|*'\\n'*) return 22 ;; # Never allow a second psql meta-command.\\n    esac\\n\"; new=\"    case \\\"\\$rvu_dsn\\\" in\\n        *'\\n'*) return 22 ;; # Never allow a second psql meta-command.\\n    esac\\n    rvu_cr=\\$(printf '\\\\r')\\n    case \\\"\\$rvu_dsn\\\" in\\n        *\\\"\\$rvu_cr\\\"*) return 22 ;; # Never allow a carriage return in the psql meta-command.\\n    esac\\n\"; assert old in s, 'malformed CR/LF guard not found'; p.write_text(s.replace(old,new,1))"
          sh -n "$target"
          git diff --check
          grep -F 'rvu_cr=$(printf '\''\r'\'')' "$target"
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PostgreSQL/postgresql_role_switch_v0.1.22.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve upstream connection CR guard'
          git push origin HEAD:main
