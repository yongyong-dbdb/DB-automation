name: Validate unselected standby reparent policy

on:
  push:
    paths:
      - '.github/workflows/add-unselected-standby-reparent-policy.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch and syntax check
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          before=$(wc -l < "$target")
          python3 .github/patches/add-unselected-standby-reparent-policy.py
          sh -n "$target"
          git diff --check
          after=$(wc -l < "$target")
          echo "before=$before after=$after"
          [ "$after" -ge "$before" ]

      - name: Reparent policy assertions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'REPARENT_UNSELECTED=0' "$target"
          grep -F 'Move existing unselected Direct Standby Servers to the New Primary after promotion' "$target"
          grep -F 'prepare_unselected_reparent_plan() {' "$target"
          grep -F 'unselected_reparent_capacity_guard() {' "$target"
          grep -F 'execute_unselected_reparent_plan() {' "$target"
          grep -F 'remote_repoint_standby() {' "$target"
          grep -F 'remote_count_reparented() {' "$target"
          grep -F -- '--remote-repoint-standby)' "$target"
          grep -F -- '--remote-count-reparented)' "$target"
          grep -F 'PG_MAJOR" -eq 12' "$target"
          grep -F 'pg_reload_conf()' "$target"
          grep -F 'Nested downstream identity changed under reparented Standby' "$target"
          grep -F 'operator chose to preserve existing upstream relationships' "$target"
          grep -F 'operator chose to reparent all unselected Direct Standbys to the New Primary' "$target"

      - name: Existing safety regressions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          for fn in select_local_instance validate_supported_version prepare_state_dir planned_switchover preconfigure_former_primary remote_create_slot psql_call_var remote_count_standby retire_switchover_restore_state_after_promotion normalize_downstream_relation_set verify_preserved_topology_edges; do
            grep -F "${fn}() {" "$target" >/dev/null || { echo "missing function: $fn"; exit 1; }
          done
          grep -F "pg_create_physical_replication_slot(:'slot', true, false)" "$target" >/dev/null
          grep -F 'OLD_PRIMARY_EFFECTIVE_APP="walreceiver"' "$target" >/dev/null
          grep -F 'pfp_restore_tmp="$pfp_restore_file.tmp.$$"' "$target" >/dev/null
          grep -F 'reverse_streaming_verified|topology_verified)' "$target" >/dev/null
          ! grep -E '128\.10\.41\.|133|134|135|136' "$target"

      - name: Topology policy matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          cases = {
              'two_direct': [('P','C'),('P','U1')],
              'direct_plus_cascade': [('P','C'),('P','U1'),('U1','D1')],
              'wide': [('P','C'),('P','U1'),('P','U2'),('P','U3')],
              'multi_branch': [('P','C'),('P','U1'),('P','U2'),('U1','D1'),('D1','D2'),('U2','D3')],
          }
          def switch(edges, reparent):
              e=set(edges)
              e.remove(('P','C'))
              e.add(('C','P'))
              direct=[b for a,b in list(e) if a=='P' and b!='C']
              if reparent:
                  for u in direct:
                      e.remove(('P',u)); e.add(('C',u))
              return e
          for name, edges in cases.items():
              preserve=switch(edges,False)
              assert ('C','P') in preserve
              for edge in set(edges)-{('P','C')}:
                  assert edge in preserve
              moved=switch(edges,True)
              assert ('C','P') in moved
              for a,b in edges:
                  if a=='P' and b not in ('C',):
                      assert ('C',b) in moved and ('P',b) not in moved
                  elif (a,b)!=('P','C'):
                      assert (a,b) in moved
              # round trip with reparent=yes restores original direct layout
              back=set(moved)
              back.remove(('C','P')); back.add(('P','C'))
              for a,b in list(back):
                  if a=='C' and b.startswith('U'):
                      back.remove((a,b)); back.add(('P',b))
              assert back==set(edges), (name, back, set(edges))
          print('policy matrix passed:', len(cases))
          PY

      - name: Runtime dependency scan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          forbidden='python|python3|jq|yq|expect|perl|node|npm|pip'
          ! grep -E "^[[:space:]]*(${forbidden})([[:space:]]|$)" "$target"
          ! grep -E "(\||;|&&|\|\|)[[:space:]]*(${forbidden})([[:space:]]|$)" "$target"
          ! grep -E "\$\([[:space:]]*(${forbidden})([[:space:]]|$)" "$target"

      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'feat: optionally reparent direct standbys after switchover'
          git push origin HEAD:main
