name: Patch PostgreSQL role switch SSH OS user prompt

on:
  push:
    paths:
      - '.github/patches/trigger-role-switch-ssh-os-user.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch prompt text
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PostgreSQL/postgresql_role_switch_v0.1.22.sh')
          s = p.read_text()
          old = '''    say "SSH User"\n    say "  Target PostgreSQL을 해당 서버에서 로컬 관리할 수 있는 OS 계정을 입력합니다."\n    REMOTE_SSH_USER=$(ask "SSH user" "$crt_user_default") || usage_die "Input cancelled."\n    [ -n "$REMOTE_SSH_USER" ] || usage_die "SSH user is required."\n'''
          new = '''    say "SSH OS User"\n    say "  원격 Standby Server에 SSH로 접속할 운영체제 계정을 입력합니다."\n    say "  PostgreSQL role이 아니라 Linux/Unix OS 계정입니다."\n    say "  이 계정은 대상 서버에서 해당 PostgreSQL 인스턴스를 관리할 수 있어야 합니다."\n    REMOTE_SSH_USER=$(ask "SSH OS user" "$crt_user_default") || usage_die "Input cancelled."\n    [ -n "$REMOTE_SSH_USER" ] || usage_die "SSH OS user is required."\n'''
          if old not in s:
              raise SystemExit('target prompt block not found')
          s = s.replace(old, new, 1)
          # Keep the existing non-interactive SSH failure text unchanged.
          p.write_text(s)
          PY
          sh -n "$target"
          git diff --check
          grep -F 'say "SSH OS User"' "$target"
          grep -F 'PostgreSQL role이 아니라 Linux/Unix OS 계정입니다.' "$target"
          grep -F 'REMOTE_SSH_USER=$(ask "SSH OS user"' "$target"
          grep -F 'Non-interactive SSH check failed for $REMOTE_TARGET. This script does not configure SSH credentials.' "$target"
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PostgreSQL/postgresql_role_switch_v0.1.22.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clarify SSH OS account prompt'
          git push origin HEAD:main
