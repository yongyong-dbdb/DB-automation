name: Generalize PostgreSQL role-switch topology

on:
  push:
    paths:
      - '.github/workflows/generalize-role-switch-topology.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply generalized topology patch
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          before=$(wc -l < "$target")
          python3 .github/patches/run-generalize-role-switch-topology.py
          sh -n "$target"
          git diff --check
          after=$(wc -l < "$target")
          echo "before=$before after=$after"
          [ "$after" -ge "$before" ]

      - name: Generic topology runtime assertions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'PRESERVED_TOPOLOGY_EDGES=""' "$target"
          grep -F 'normalize_downstream_relation_set() {' "$target"
          grep -F 'append_preserved_topology_edge() {' "$target"
          grep -F 'verify_preserved_topology_edges() {' "$target"
          grep -F 'application_name/client_addr/physical-slot set differs' "$target"
          grep -F 'selected-candidate-existing-downstream' "$target"
          grep -F 'unselected-current-primary-downstream' "$target"
          grep -F 'no server address or fixed node count was assumed' "$target"
          ! grep -E '128\.10\.41\.|133|134|135|136' "$target"

      - name: Topology matrix regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # CI-only graph model. Runtime script remains POSIX sh with no Python dependency.
          cases = {
              'single': [('P','S1')],
              'fanout2': [('P','S1'),('P','S2')],
              'candidate_cascade': [('P','S1'),('S1','S2')],
              'unselected_cascade': [('P','S1'),('P','S2'),('S2','S3')],
              'deep_chain': [('P','S1'),('S1','S2'),('S2','S3'),('S3','S4')],
              'multi_branch': [('P','S1'),('P','S2'),('S1','S3'),('S1','S4'),('S2','S5'),('S5','S6')],
              'wide_fanout': [('P','S1'),('P','S2'),('P','S3'),('P','S4')],
              'mixed_depth': [('P','S1'),('P','S2'),('S1','S3'),('S3','S4'),('S2','S5')],
          }
          def switch(edges, primary, candidate):
              edges=set(edges)
              assert (primary,candidate) in edges
              edges.remove((primary,candidate))
              edges.add((candidate,primary))
              return edges
          for name, edges in cases.items():
              initial=set(edges)
              candidate='S1'
              fwd=switch(initial,'P',candidate)
              assert (candidate,'P') in fwd
              for e in initial - {('P',candidate)}:
                  assert e in fwd, (name, 'lost preserved edge', e)
              back=switch(fwd,candidate,'P')
              assert back == initial, (name, 'round trip mismatch', initial, back)
          metadata_cases = [
              {'slot':True,'transport':'ssh'},
              {'slot':False,'transport':'ssh'},
              {'slot':True,'transport':'local'},
              {'slot':False,'transport':'local'},
          ]
          assert len(metadata_cases) == 4
          print('topology matrix cases:', len(cases), 'metadata combinations:', len(metadata_cases))
          PY

      - name: Compatibility and safety regressions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          for fn in select_local_instance validate_supported_version prepare_state_dir planned_switchover preconfigure_former_primary remote_create_slot psql_call_var remote_count_standby retire_switchover_restore_state_after_promotion; do
            grep -F "${fn}() {" "$target" >/dev/null || { echo "missing function: $fn"; exit 1; }
          done
          grep -F 'PostgreSQL 12~18' "$target" >/dev/null
          grep -F "pg_create_physical_replication_slot(:'slot', true, false)" "$target" >/dev/null
          grep -F 'OLD_PRIMARY_EFFECTIVE_APP="walreceiver"' "$target" >/dev/null
          grep -F 'pfp_restore_tmp="$pfp_restore_file.tmp.$$"' "$target" >/dev/null
          grep -F 'reverse_streaming_verified|topology_verified)' "$target" >/dev/null
          block=$(awk '/^psql_call_var\(\)/,/^}/' "$target")
          ! printf '%s\n' "$block" | grep -F -- '-c "$pcv_sql"'

      - name: Runtime dependency scan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          ! awk '!/^[[:space:]]*#/' "$target" | grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)'

      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: generalize PostgreSQL switchover topology preservation'
          git push origin HEAD:main
