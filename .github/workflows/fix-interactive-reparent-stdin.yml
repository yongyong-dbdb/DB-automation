name: Fix interactive reparent stdin

on:
  push:
    paths:
      - '.github/workflows/fix-interactive-reparent-stdin.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/fix-interactive-reparent-stdin.py
          sh -n "$target"
          git diff --check
          grep -F "while IFS='|' read -r urp_transport urp_target urp_pgdata urp_app urp_client urp_user urp_old_slot urp_nested_count urp_relations <&3; do" "$target"
          grep -F 'done 3< "$UNSELECTED_REPARENT_CANDIDATES"' "$target"

      - name: Interactive stdin regression
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 - <<'PY'
          from pathlib import Path
          s=Path('PostgreSQL/postgresql_role_switch_v0.1.22.sh').read_text()
          start=s.index('prepare_unselected_reparent_plan() {')
          end=s.index('\nunselected_reparent_capacity_guard() {', start)
          block=s[start:end]
          assert 'read -r urp_transport' in block and '<&3' in block
          assert 'done 3< "$UNSELECTED_REPARENT_CANDIDATES"' in block
          assert 'urp_extra=$(ask ' in block
          assert 'urp_slot=$(ask ' in block
          # Guard against reintroducing redirected stdin for this interactive loop.
          assert 'done < "$UNSELECTED_REPARENT_CANDIDATES"' not in block
          print('interactive reparent stdin isolation passed')
          PY

      - name: Existing safety and dependency regressions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          for fn in planned_switchover prepare_unselected_reparent_plan execute_unselected_reparent_plan remote_repoint_standby remote_create_slot psql_call_var retire_switchover_restore_state_after_promotion; do
            grep -F "${fn}() {" "$target" >/dev/null
          done
          grep -F "pg_create_physical_replication_slot(:'slot', true, false)" "$target" >/dev/null
          ! grep -E '128\.10\.41\.|133|134|135|136' "$target"
          forbidden='python|python3|jq|yq|expect|perl|node|npm|pip'
          ! grep -E "^[[:space:]]*(${forbidden})([[:space:]]|$)" "$target"
          ! grep -E "(\||;|&&|\|\|)[[:space:]]*(${forbidden})([[:space:]]|$)" "$target"
          ! grep -E "\$\([[:space:]]*(${forbidden})([[:space:]]|$)" "$target"

      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git commit -m 'fix: preserve interactive stdin during standby reparent planning'
          git push origin HEAD:main
