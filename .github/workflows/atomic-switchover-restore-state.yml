name: Atomic switchover restore state

on:
  push:
    paths:
      - '.github/workflows/atomic-switchover-restore-state.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/atomic-switchover-restore-state.py
          sh -n "$target"
          git diff --check
      - name: Restore-state assertions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          block=$(awk '/^preconfigure_former_primary\(\)/,/^}/' "$target")
          printf '%s\n' "$block" | grep -F 'pfp_restore_tmp="$pfp_restore_file.tmp.$$"'
          printf '%s\n' "$block" | grep -F '} > "$pfp_restore_tmp"; then'
          printf '%s\n' "$block" | grep -F '[ -s "$pfp_restore_tmp" ]'
          printf '%s\n' "$block" | grep -F 'mv "$pfp_restore_tmp" "$pfp_restore_file"'
          ! printf '%s\n' "$block" | grep -F '> "$pfp_restore_file" || die "Could not save primary_conninfo rollback state."'
      - name: Verify psql variable helper remains stdin-based
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          block=$(awk '/^psql_call_var\(\)/,/^}/' "$target")
          printf '%s\n' "$block" | grep -F "printf '%s\\n' \"\$pcv_sql\" | \"\$PSQL_BIN\""
          ! printf '%s\n' "$block" | grep -F -- '-c "$pcv_sql"'
      - name: Dependency scan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          ! awk '!/^[[:space:]]*#/' "$target" | grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)'
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make switchover restore state atomic'
          git push origin HEAD:main
