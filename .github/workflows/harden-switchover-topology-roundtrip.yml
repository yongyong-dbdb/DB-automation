name: Harden round-trip switchover topology

on:
  push:
    paths:
      - '.github/workflows/harden-switchover-topology-roundtrip.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply targeted patch
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/run-harden-switchover-topology-roundtrip.py
          sh -n "$target"
          git diff --check
      - name: Phase and restore-state regression
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'reverse_streaming_verified|topology_verified)' "$target"
          grep -F 'retire_switchover_restore_state_after_promotion() {' "$target"
          grep -F 'switchover.prepromotion.${rsr_stamp}.$$.history.sql' "$target"
          grep -F 'CURRENT_PHASE="reverse_streaming_verified"' "$target"
          grep -F 'CURRENT_PHASE="topology_verified"' "$target"
          grep -F 'Do NOT apply it automatically after promotion.' "$target"
      - name: Round-trip topology regression
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'CANDIDATE_TOPOLOGY_SNAPSHOT' "$target"
          grep -F 'UNSELECTED_TOPOLOGY_SNAPSHOT' "$target"
          grep -F 'verify_preserved_topology_snapshot() {' "$target"
          grep -F 'Selected Standby existing downstream' "$target"
          grep -F 'Unselected Standby cascading downstream' "$target"
          grep -F 'nested_downstream_count=' "$target"
          grep -F 'sender_host changed from' "$target"
      - name: Preserve existing critical fixes
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          for fn in select_local_instance validate_supported_version prepare_state_dir planned_switchover preconfigure_former_primary remote_create_slot psql_call_var remote_count_standby; do
            grep -F "${fn}() {" "$target" >/dev/null
          done
          grep -F "pg_create_physical_replication_slot(:'slot', true, false)" "$target" >/dev/null
          grep -F 'pfp_restore_tmp="$pfp_restore_file.tmp.$$"' "$target" >/dev/null
          grep -F 'OLD_PRIMARY_EFFECTIVE_APP="walreceiver"' "$target" >/dev/null
          grep -F 'Reverse Streaming Verification' "$target" >/dev/null
          block=$(awk '/^psql_call_var\(\)/,/^}/' "$target")
          [ "$(printf '%s\n' "$block" | grep -F -c "printf '%s\\n' \"\$pcv_sql\" | \"\$PSQL_BIN\"")" -eq 5 ]
          ! printf '%s\n' "$block" | grep -F -- '-c "$pcv_sql"'
      - name: No accidental bulk deletion
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          base=$(git show HEAD:"$target" | wc -l)
          now=$(wc -l < "$target")
          echo "base=$base now=$now"
          [ "$now" -ge "$base" ]
      - name: Dependency scan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          ! awk '!/^[[:space:]]*#/' "$target" | grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)'
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden round-trip switchover topology validation'
          git push origin HEAD:main
