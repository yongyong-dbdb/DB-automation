name: Patch PostgreSQL role switch safety

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-postgresql-role-switch-safety.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Apply and validate patch
        working-directory: repo
        run: sh .github/patch-postgresql-role-switch-safety.sh
