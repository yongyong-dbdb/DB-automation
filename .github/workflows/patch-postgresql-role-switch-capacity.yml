name: Patch PostgreSQL role switch capacity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-postgresql-role-switch-capacity.yml'
      - '.github/patches/pg-role-switch-max-wal-senders.sh'
      - '.github/patches/pg-role-switch-max-wal-senders-v4.sh'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Apply, validate, commit, and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd repo
          git checkout main
          sh .github/patches/pg-role-switch-max-wal-senders-v4.sh
          TARGET='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          sh -n "$TARGET"
          git diff --check -- "$TARGET"
          git diff --exit-code --quiet -- "$TARGET" && { echo 'Target was not changed.' >&2; exit 1; }
          git config user.name 'yongyong-dbdb'
          git config user.email 'c4ic79@kyonggi.ac.kr'
          git add "$TARGET"
          git commit -m 'fix: align switchover sender capacity with PostgreSQL docs'
          git push origin main
