name: restore-ic-v1015

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ic-v1015.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct and validate script
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ic_v1015_payload.part00 \
              .github/ic_v1015_payload.part01 \
              .github/ic_v1015_payload.part02 > /tmp/ic_v1015.b64
          base64 -d /tmp/ic_v1015.b64 | xz -d > /tmp/mysql_innodb_cluster_migrate.sh
          echo '71bb6ec0260b0711c2fcb60de247874a2df7ca07118e21d2aee9bd0fab4725f7  /tmp/mysql_innodb_cluster_migrate.sh' | sha256sum -c -
          sh -n /tmp/mysql_innodb_cluster_migrate.sh
          grep -q '^# mysql_innodb_cluster_migrate.sh v1\.0\.15$' /tmp/mysql_innodb_cluster_migrate.sh
          grep -q '^VERSION=1\.0\.15$' /tmp/mysql_innodb_cluster_migrate.sh
          mkdir -p MySQL/InnoDB-Cluster
          cp /tmp/mysql_innodb_cluster_migrate.sh MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          chmod 755 MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
      - name: Commit validated single-file implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/ic_v1015_payload.part00 \
                .github/ic_v1015_payload.part01 \
                .github/ic_v1015_payload.part02 \
                .github/workflows/restore-ic-v1015.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add InnoDB Cluster migration automation v1.0.15'
          git push origin main
