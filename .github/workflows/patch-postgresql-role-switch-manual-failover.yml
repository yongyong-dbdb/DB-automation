name: Patch PostgreSQL role switch manual failover

on:
  pull_request:
    paths:
      - '.github/patches/manual-failover-pr-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch and validate
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/manual_failover_patch.py
          sh -n "$target"
          git diff --check
          grep -F 'show_switchover_execution_plan' "$target"
          grep -F 'Manual Failover Execution Plan' "$target"
          grep -F 'confirm_word "PRIMARY_UNAVAILABLE"' "$target"
          grep -F 'confirm_word "PRIMARY_FENCED"' "$target"
          grep -F 'confirm_word "ACCEPT_DATA_LOSS_RISK"' "$target"
          grep -F 'confirm_word "FAILOVER"' "$target"
          grep -F '2. Manual Failover' "$target"
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PostgreSQL/postgresql_role_switch_v0.1.22.sh
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add manual failover and switchover execution plan'
          git push origin HEAD:main
