name: Patch PostgreSQL role switch cancel and SSH guard

on:
  push:
    paths:
      - '.github/patches/trigger-role-switch-cancel-ssh-guard.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch script
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('PostgreSQL/postgresql_role_switch_v0.1.22.sh')
          s=p.read_text()

          s=s.replace('EXIT_REMOTE=3\n', 'EXIT_REMOTE=3\nEXIT_CANCELLED=4\n', 1)

          old='''remote_die() {\n    LAST_ERROR=$*\n    record_check "FAILED" "Remote Execution" "$*"\n    error "$*"\n    exit "$EXIT_REMOTE"\n}\n'''
          new='''remote_die() {\n    LAST_ERROR=$*\n    record_check "FAILED" "Remote Execution" "$*"\n    error "$*"\n    exit "$EXIT_REMOTE"\n}\n\ncancel_operation() {\n    LAST_ERROR=$*\n    record_check "CANCELLED" "Operation" "$*"\n    printf '[CANCELLED] %s\\n' "$*" >&2\n    cleanup_tmp\n    exit "$EXIT_CANCELLED"\n}\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''    elif [ "$frr_code" -eq "$EXIT_REMOTE" ]; then\n        frr_status="FAILED"\n        frr_detail="remote connection or execution error"\n    else\n'''
          new='''    elif [ "$frr_code" -eq "$EXIT_REMOTE" ]; then\n        frr_status="FAILED"\n        frr_detail="remote connection or execution error"\n    elif [ "$frr_code" -eq "$EXIT_CANCELLED" ]; then\n        frr_status="CANCELLED"\n        frr_detail=${LAST_ERROR:-operation cancelled by user}\n    else\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''    awk -F '\\t' 'NF >= 2 && ($1=="PASSED" || $1=="WARNING" || $1=="FAILED" || $1=="MANUAL CHECK") {printf "  %-12s %-28s %s\\n", "[" $1 "]", $2, $3}' "$RESULT_FILE" 2>/dev/null || true\n'''
          new='''    awk -F '\\t' 'NF >= 2 && ($1=="PASSED" || $1=="WARNING" || $1=="FAILED" || $1=="MANUAL CHECK" || $1=="CANCELLED") {printf "  %-12s %-28s %s\\n", "[" $1 "]", $2, $3}' "$RESULT_FILE" 2>/dev/null || true\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''    REMOTE_TARGET="$REMOTE_SSH_USER@$REMOTE_SSH_HOST"\n\n    ssh -o BatchMode=yes -o ConnectTimeout=5 "$REMOTE_TARGET" 'sh -c "exit 0"' >/dev/null 2>&1 || remote_die "Non-interactive SSH check failed for $REMOTE_TARGET. This script does not configure SSH credentials."\n'''
          new='''    REMOTE_TARGET="$REMOTE_SSH_USER@$REMOTE_SSH_HOST"\n\n    mktemp_safe || remote_die "Could not create temporary file for SSH validation."\n    crt_ssh_err=$SAFE_TMP\n    crt_check_cmd=$(remote_build_command --help)\n    if ! ssh -T -o BatchMode=yes -o ConnectTimeout=5 "$REMOTE_TARGET" "$crt_check_cmd" < "$SCRIPT_PATH" >/dev/null 2>"$crt_ssh_err"; then\n        [ ! -s "$crt_ssh_err" ] || cat "$crt_ssh_err" >&2\n        remote_die "Non-interactive SSH check failed for $REMOTE_TARGET. This script does not configure SSH credentials."\n    fi\n    if grep -Ei 'command not found|syntax error|unexpected EOF|not found$' "$crt_ssh_err" >/dev/null 2>&1; then\n        cat "$crt_ssh_err" >&2\n        remote_die "Non-interactive SSH check failed for $REMOTE_TARGET. This script does not configure SSH credentials."\n    fi\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''    if ! choose_yes_no "Former Primary의 자동 재기동/자동 failover가 중지되어 있고 fencing 또는 동등한 split-brain 방지 절차가 준비되어 있습니까" "no"; then\n        die "Switchover aborted because external restart/failover/fencing control was not confirmed."\n    fi\n'''
          new='''    if ! choose_yes_no "Former Primary의 자동 재기동/자동 failover가 중지되어 있고 fencing 또는 동등한 split-brain 방지 절차가 준비되어 있습니까" "no"; then\n        cancel_operation "Switchover cancelled because external restart/failover/fencing control was not confirmed."\n    fi\n'''
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s)
          PY

          sh -n "$target"
          git diff --check
          grep -F 'EXIT_CANCELLED=4' "$target"
          grep -F 'cancel_operation "Switchover cancelled because external restart/failover/fencing control was not confirmed."' "$target"
          grep -F 'crt_check_cmd=$(remote_build_command --help)' "$target"
          grep -F 'Non-interactive SSH check failed for $REMOTE_TARGET. This script does not configure SSH credentials.' "$target"
          ! grep -F 'Switchover aborted because external restart/failover/fencing control was not confirmed.' "$target"

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PostgreSQL/postgresql_role_switch_v0.1.22.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: classify user cancellation and validate remote script transport'
          git push origin HEAD:main
