name: Apply GR v1.0.14 stale-work-root diagnosis
on:
  push:
    paths:
      - '.github/workflows/gr-v1014-stale-root.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch validated stale-root diagnosis
        shell: bash
        run: |
          set -euo pipefail
          f='MySQL/Group-Replication/mysql_gr_migrate.sh'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MySQL/Group-Replication/mysql_gr_migrate.sh')
          s=p.read_text()
          old='''connected() {\n    for ci in $(ids); do\n        credential "$ci"\n        [ "$(sql "$ci" 'SELECT 1;')" = 1 ] || die "Node $ci connection failed"\n        [ "$(val "$ci" server_uuid)" = "$(get "$ci" uuid)" ] || die "Node $ci UUID changed; rediscover before proceeding"\n    done\n}\n'''
          new='''suggest_compatible_work_roots() {\n    parent=$(dirname "$ROOT")\n    current_count=$(get meta count 2>/dev/null || printf '0')\n    [ "$current_count" -gt 0 ] 2>/dev/null || return 0\n    found=no\n    for candidate in "$parent"/*; do\n        [ -d "$candidate" ] || continue\n        [ ! -L "$candidate" ] || continue\n        [ "$candidate" != "$ROOT" ] || continue\n        [ -f "$candidate/meta/count" ] || continue\n        [ "$(cat "$candidate/meta/count" 2>/dev/null || printf '')" = "$current_count" ] || continue\n        match=yes\n        n=1\n        while [ "$n" -le "$current_count" ]; do\n            [ -f "$candidate/$n/uuid" ] || { match=no; break; }\n            [ -f "$TEMP/live_uuid_$n" ] || { match=no; break; }\n            [ "$(cat "$candidate/$n/uuid")" = "$(cat "$TEMP/live_uuid_$n")" ] || { match=no; break; }\n            n=$((n+1))\n        done\n        [ "$match" = yes ] || continue\n        if [ "$found" = no ]; then\n            log 'Compatible migration work root detected for the current server UUIDs:'\n            found=yes\n        fi\n        log "  $candidate"\n    done\n    if [ "$found" = yes ]; then\n        log 'Use one of the paths above explicitly, for example:'\n        log "  export MYSQL_GR_WORK_ROOT=<compatible_path>"\n        log 'The stale work root was not modified or deleted.'\n    else\n        log 'No compatible sibling work root was found. Run discover with a NEW MYSQL_GR_WORK_ROOT; do not delete the stale project until reviewed.'\n    fi\n}\nconnected() {\n    mismatch=''\n    for ci in $(ids); do\n        credential "$ci"\n        [ "$(sql "$ci" 'SELECT 1;')" = 1 ] || die "Node $ci connection failed"\n        live_uuid=$(val "$ci" server_uuid)\n        printf '%s\\n' "$live_uuid" > "$TEMP/live_uuid_$ci"\n        if [ "$live_uuid" != "$(get "$ci" uuid)" ]; then\n            mismatch="${mismatch}${mismatch:+ }$ci"\n        fi\n    done\n    if [ -n "$mismatch" ]; then\n        log "ERROR: Server UUID changed for node(s): $mismatch. The selected MYSQL_GR_WORK_ROOT is stale."\n        suggest_compatible_work_roots\n        die 'Select the compatible work root shown above, or rediscover into a new work root before proceeding.'\n    fi\n}\n'''
          if old not in s:
              raise SystemExit('expected connected() block not found exactly')
          s=s.replace(old,new,1)
          s=s.replace('# mysql_gr_migrate.sh v1.0.13','# mysql_gr_migrate.sh v1.0.14',1)
          s=s.replace('VERSION=1.0.13','VERSION=1.0.14',1)
          p.write_text(s)
          PY
          sh -n "$f"
          grep -q '^VERSION=1.0.14$' "$f"
          grep -q '^suggest_compatible_work_roots() {' "$f"
          ! grep -Eq '(^|[^[:alnum:]_])(pip|npm|apt|dnf|yum)[[:space:]]+install' "$f"
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/gr-v1014-stale-root.yml
          git add MySQL/Group-Replication/mysql_gr_migrate.sh .github/workflows/gr-v1014-stale-root.yml
          git commit -m 'Improve GR stale work-root recovery guidance'
          git push
