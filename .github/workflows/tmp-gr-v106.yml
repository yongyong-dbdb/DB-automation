name: Temporary MySQL GR v1.0.6 update
on:
  push:
    paths:
      - '.github/workflows/tmp-gr-v106.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate v1.0.6
        shell: bash
        run: |
          python3 .github/tmp_patch_gr_v106.py
          target='MySQL/Group-Replication/mysql_gr_migrate.sh'
          sh -n "$target"
          test "$(sh "$target" --version)" = '1.0.6'
          grep -Fq 'divergent GTID action (inspect/external/abort)' "$target"
          grep -Fq -- '--read-from-remote-server' "$target"
          grep -Fq 'EXTRA_PURGED_FROM_CURRENT_BINLOGS' "$target"
          grep -Fq 'MYSQL_GR_MYSQLBINLOG' "$target"
          ! grep -Fq 'RESET BINARY LOGS AND GTIDS;' "$target"
          ! grep -E 'mysqlbinlog[^|]*\|[[:space:]]*mysql([[:space:]]|$)' "$target"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git rm .github/workflows/tmp-gr-v106.yml .github/tmp_patch_gr_v106.py
          git commit -m 'MySQL GR v1.0.6: add safe divergence inspection workflow'
          git push origin HEAD:main
