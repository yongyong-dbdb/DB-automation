name: Preserve empty reverse application_name

on:
  push:
    paths:
      - '.github/workflows/preserve-empty-reverse-application-name.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/preserve-empty-reverse-application-name.py
          sh -n "$target"
          git diff --check
      - name: application_name regression assertions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'Former Primary application_name (empty = omit)' "$target"
          grep -F 'application_name=<omitted>' "$target"
          grep -F 'REVERSE_CONNINFO="host=' "$target"
          grep -F 'if [ -n "$OLD_PRIMARY_APP" ]; then' "$target"
          ! grep -F 'OLD_PRIMARY_APP_DEFAULT=$(hostname' "$target"
          ! grep -F 'OLD_PRIMARY_APP_DEFAULT=$(psql_call "SHOW cluster_name"' "$target"
      - name: slot default regression assertions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          test "$(grep -F 'slot_identity=${OLD_PRIMARY_APP:-$(hostname 2>/dev/null || echo former_primary)}' "$target" | wc -l)" -eq 2
          ! grep -F 'sanitize_identifier "${OLD_PRIMARY_APP}_slot"' "$target"
      - name: Dependency scan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          ! awk '!/^[[:space:]]*#/' "$target" | grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)'
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve empty reverse application name'
          git push origin HEAD:main
