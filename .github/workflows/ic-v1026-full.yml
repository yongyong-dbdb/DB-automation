name: Restore full InnoDB Cluster v1.0.26
on:
  push:
    paths:
      - '.github/workflows/ic-v1026-full.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore exact validated file
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ic.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/ic.gz.b64 | gzip -dc > MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          test "$(sha256sum MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh | awk '{print $1}')" = "0079882fe17a3e683c507afafb260901aca9c1ab1be38182aef57cc73230d2e8"
          sh -n MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'v1.0.26' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
      - name: Commit exact file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ic-v1026-full.yml
          git add MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh .github/workflows/ic-v1026-full.yml
          git commit -m 'Restore full InnoDB Cluster v1.0.26'
          git push origin main
