name: Patch PostgreSQL role switch all SSH guards

on:
  push:
    paths:
      - '.github/patches/trigger-role-switch-all-ssh-guards.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch all remaining SSH guards
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('PostgreSQL/postgresql_role_switch_v0.1.22.sh')
          s=p.read_text()
          old='''            ssh -o BatchMode=yes -o ConnectTimeout=5 "$cdc_target" 'sh -c "exit 0"' >/dev/null 2>&1 || remote_die "Non-interactive SSH check failed for $cdc_target."\n'''
          new='''            mktemp_safe || remote_die "Could not create temporary file for Downstream SSH validation."\n            cdc_ssh_err=$SAFE_TMP\n            cdc_check_cmd=$(remote_build_command --help)\n            if ! ssh -T -o BatchMode=yes -o ConnectTimeout=5 "$cdc_target" "$cdc_check_cmd" < "$SCRIPT_PATH" >/dev/null 2>"$cdc_ssh_err"; then\n                [ ! -s "$cdc_ssh_err" ] || cat "$cdc_ssh_err" >&2\n                remote_die "Non-interactive SSH check failed for $cdc_target."\n            fi\n            if grep -Ei 'command not found|syntax error|unexpected EOF|not found$' "$cdc_ssh_err" >/dev/null 2>&1; then\n                cat "$cdc_ssh_err" >&2\n                remote_die "Non-interactive SSH check failed for $cdc_target."\n            fi\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''            ssh -o BatchMode=yes -o ConnectTimeout=5 "$usc_target" 'sh -c "exit 0"' >/dev/null 2>&1 || remote_die "Non-interactive SSH check failed for $usc_target."\n'''
          new='''            mktemp_safe || remote_die "Could not create temporary file for Standby Server SSH validation."\n            usc_ssh_err=$SAFE_TMP\n            usc_check_cmd=$(remote_build_command --help)\n            if ! ssh -T -o BatchMode=yes -o ConnectTimeout=5 "$usc_target" "$usc_check_cmd" < "$SCRIPT_PATH" >/dev/null 2>"$usc_ssh_err"; then\n                [ ! -s "$usc_ssh_err" ] || cat "$usc_ssh_err" >&2\n                remote_die "Non-interactive SSH check failed for $usc_target."\n            fi\n            if grep -Ei 'command not found|syntax error|unexpected EOF|not found$' "$usc_ssh_err" >/dev/null 2>&1; then\n                cat "$usc_ssh_err" >&2\n                remote_die "Non-interactive SSH check failed for $usc_target."\n            fi\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          sh -n "$target"
          git diff --check
          ! grep -F "sh -c \"exit 0\"" "$target"
          grep -F 'cdc_check_cmd=$(remote_build_command --help)' "$target"
          grep -F 'usc_check_cmd=$(remote_build_command --help)' "$target"
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PostgreSQL/postgresql_role_switch_v0.1.22.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: validate all remote SSH script transports'
          git push origin HEAD:main
