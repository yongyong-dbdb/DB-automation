name: Apply InnoDB Cluster v1.0.25
on:
  push:
    paths:
      - '.github/workflows/ic-v1025.yml'
      - '.github/ic-v1025.patch.gz.b64'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/ic-v1025.patch.gz.b64 | gzip -d > /tmp/ic.patch
          git apply --check /tmp/ic.patch
          git apply /tmp/ic.patch
          sh -n MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'v1.0.25' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'INTERACTIVE PROMPT POLICY' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          ! grep -Eq 'Example.*([0-9]{1,3}\.){3}[0-9]{1,3}|Example.*:[0-9]{2,5}' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
      - name: Commit product file and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/ic-v1025.patch.gz.b64 .github/workflows/ic-v1025.yml
          git add MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh .github/ic-v1025.patch.gz.b64 .github/workflows/ic-v1025.yml
          git commit -m 'Improve InnoDB Cluster discovery and prompt UX v1.0.25'
          git push origin main
