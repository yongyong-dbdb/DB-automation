name: Temporary MySQL GR v1.0.11 update
on:
  push:
    paths:
      - '.github/tmp_patch_gr_v1011.py'
      - '.github/workflows/tmp-gr-v1011.yml'
permissions:
  contents: write
jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 .github/tmp_patch_gr_v1011.py
      - name: Validate syntax and dash/mawk runtime
        shell: bash
        run: |
          set -e
          S='MySQL/Group-Replication/mysql_gr_migrate.sh'
          sh -n "$S"
          sh "$S" --version | grep -Fx 1.0.11
          grep -F 'platform_preflight()' "$S"
          grep -F 'readlink sha256sum tee stat id sleep' "$S"
          T=$(mktemp)
          cp "$S" "$T"
          sed -i '${/^main$/d;}' "$T"
          dash -c ". '$T'; platform_preflight"
          E=$(mktemp)
          cat > "$E" <<'EOF'
          SET @@SESSION.GTID_NEXT= 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa:1'/*!*/;
          RENAME TABLE `db1`.`old1` TO `db1`.`new1`, `db1`.`old2` TO `db1`.`new2`
          EOF
          R=$(mktemp -d)
          dash -c ". '$T'; RUN='$R'; summarize_mysqlbinlog_evidence 9 '$E'"
          grep -F $'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa:1\tDDL\tRENAME TABLE\tdb1.old1' "$R/node_9.errant_gtid_summary.tsv"
          grep -F $'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa:1\tDDL\tRENAME TABLE\tdb1.new1' "$R/node_9.errant_gtid_summary.tsv"
          grep -F $'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa:1\tDDL\tRENAME TABLE\tdb1.old2' "$R/node_9.errant_gtid_summary.tsv"
          grep -F $'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa:1\tDDL\tRENAME TABLE\tdb1.new2' "$R/node_9.errant_gtid_summary.tsv"
          ! grep -E 'RESET (MASTER|BINARY LOGS AND GTIDS)' "$S"
          ! grep -E 'mysqlbinlog[^#]*[|][^#]*mysql([[:space:]]|$)' "$S"
          rm -rf "$T" "$E" "$R"
      - name: Commit target and cleanup staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'MySQL/Group-Replication/mysql_gr_migrate.sh'
          git commit -m 'MySQL GR v1.0.11: harden portability and rename inspection'
          git rm -f .github/tmp_patch_gr_v1011.py .github/workflows/tmp-gr-v1011.yml
          git commit -m 'chore: remove temporary GR v1.0.11 validation files'
          git push origin main
