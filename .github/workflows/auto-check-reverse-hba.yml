name: Auto-check reverse HBA

on:
  push:
    paths:
      - '.github/workflows/auto-check-reverse-hba.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch and shell validation
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/auto-check-reverse-hba.py
          sh -n "$target"
          git diff --check
      - name: PostgreSQL 12-18 compatibility assertions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'FROM pg_hba_file_rules' "$target"
          grep -F 'line_number,type,database,user_name,address,netmask,auth_method,error' "$target"
          ! grep -A120 '^remote_hba_check()' "$target" | grep -E 'rule_number|file_name'
          grep -F "database @> ARRAY['replication']::text[]" "$target"
          grep -F "inet_same_family(address::inet" "$target"
          grep -F "address::inet & netmask::inet" "$target"
          grep -F "first potentially matching rule" "$target"
          grep -F "auth_method=%s requires credential/certificate/external-auth verification" "$target"
          grep -F "hba_file is newer than pg_conf_load_time()" "$target"
          grep -F "include directives" "$target"
      - name: Result policy assertions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'check_reverse_streaming_authentication || :' "$target"
          grep -F 'pg_hba_file_rules first matching rule' "$target"
          grep -F -- '--remote-hba-check' "$target"
          ! grep -F 'pg_hba.conf, passfile or certificate must be confirmed before Planned Switchover' "$target"
      - name: No new runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          ! awk '!/^[[:space:]]*#/' "$target" | grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)'
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: auto-check reverse replication HBA rules'
          git push origin HEAD:main
