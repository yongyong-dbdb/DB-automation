name: Explicit physical slot options

on:
  push:
    paths:
      - '.github/workflows/explicit-physical-slot-options.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/explicit-physical-slot-options.py
          sh -n "$target"
          git diff --check
      - name: Slot option assertions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F "pg_create_physical_replication_slot('$rcs_slot', true, false)" "$target"
          grep -F 'immediately_reserve=true' "$target"
          grep -F 'temporary=false' "$target"
          grep -F 'physical_inactive -> reuse the existing physical slot' "$target"
          grep -F 'physical_active   -> abort' "$target"
          grep -F 'conflict          -> abort' "$target"
          grep -F 'REVERSE_SLOT_PRECHECK_STATE=$css_slot_state' "$target"
      - name: Slot runtime branch assertions
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -A55 '^remote_create_slot()' "$target" | grep -F "rcs_count"
          grep -A55 '^remote_create_slot()' "$target" | grep -F $'SLOT\\t%s\\tcreated'
          grep -A55 '^remote_create_slot()' "$target" | grep -F $'SLOT\\t%s\\treused'
          ! grep -A55 '^remote_create_slot()' "$target" | grep -F "pg_create_physical_replication_slot(:'slot', true)"
      - name: Dependency scan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          ! awk '!/^[[:space:]]*#/' "$target" | grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)'
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make physical slot creation options explicit'
          git push origin HEAD:main
