name: Apply InnoDB Cluster v1.0.21
on:
  push:
    paths:
      - '.github/ic-v1021.patch'
      - '.github/workflows/ic-v1021.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/ic-v1021.patch
          git apply .github/ic-v1021.patch
          sh -n MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'mysql_innodb_cluster_migrate.sh v1.0.21' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          ! grep -F -- '--no-wizard --uri "$uri" --passwords-from-stdin' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          git commit -m 'Fix mysqlsh password stdin option conflict in v1.0.21'
          git push
      - name: Remove temporary files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git rm .github/ic-v1021.patch .github/workflows/ic-v1021.yml
          git commit -m 'Remove temporary v1.0.21 workflow files'
          git push
