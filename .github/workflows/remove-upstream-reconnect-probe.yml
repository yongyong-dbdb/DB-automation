name: Remove redundant upstream reconnect probe

on:
  push:
    paths:
      - '.github/workflows/remove-upstream-reconnect-probe.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/remove-upstream-reconnect-probe.py
          sh -n "$target"
          git diff --check
      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'Streaming Topology Cross-check' "$target"
          grep -F 'pg_stat_wal_receiver.sender_port' "$target"
          grep -F 'REMOTE_RECEIVER_SLOT' "$target"
          ! grep -F -- '--remote-verify-upstream' "$target"
          ! grep -F 'remote_verify_upstream()' "$target"
          ! grep -F 'IDENTIFY_SYSTEM;' "$target"
          ! grep -F 'replication=true' "$target"
      - name: Dependency scan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          ! awk '!/^[[:space:]]*#/' "$target" | grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)'
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: trust live streaming topology instead of reconnect probe'
          git push origin HEAD:main
