name: Fix reverse standby verification

on:
  push:
    paths:
      - '.github/workflows/fix-reverse-standby-verification.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply targeted patch
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/fix-reverse-standby-verification.py
          sh -n "$target"
          git diff --check
      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'OLD_PRIMARY_EFFECTIVE_APP="walreceiver"' "$target"
          grep -F 'OLD_PRIMARY_APP_SOURCE="PostgreSQL default from cluster_name"' "$target"
          grep -F 'remote_invoke --remote-count-standby "$REMOTE_PGDATA" "$OLD_PRIMARY_EFFECTIVE_APP" "${REVERSE_SLOT:-}"' "$target"
          grep -F "s.slot_type='physical' AND s.slot_name='\$rcs2_slot'" "$target"
          grep -F '[ "$#" -eq 4 ] || exit 64' "$target"
          grep -F 'Reverse Streaming Verification' "$target"
          ! grep -F 'application_name=$OLD_PRIMARY_APP; expected exactly 1' "$target"
      - name: Preserve previous fixes
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          for fn in select_local_instance validate_supported_version prepare_state_dir planned_switchover preconfigure_former_primary remote_create_slot psql_call_var; do
            grep -F "${fn}() {" "$target" >/dev/null
          done
          grep -F "pg_create_physical_replication_slot(:'slot', true, false)" "$target" >/dev/null
          grep -F 'pfp_restore_tmp="$pfp_restore_file.tmp.$$"' "$target" >/dev/null
          block=$(awk '/^psql_call_var\(\)/,/^}/' "$target")
          [ "$(printf '%s\n' "$block" | grep -F -c "printf '%s\\n' \"\$pcv_sql\" | \"\$PSQL_BIN\"")" -eq 5 ]
          ! printf '%s\n' "$block" | grep -F -- '-c "$pcv_sql"'
      - name: Dependency scan
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          ! awk '!/^[[:space:]]*#/' "$target" | grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)'
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: verify reverse standby with effective application name'
          git push origin HEAD:main
