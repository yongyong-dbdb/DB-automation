name: Apply GR v1.0.15 final safety checks
on:
  push:
    paths: ['.github/workflows/gr-v1015-final.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gr.patch.b64 <<'EOF'

EOF
          base64 -d /tmp/gr.patch.b64 > /tmp/gr.patch
          git apply --check /tmp/gr.patch
          git apply /tmp/gr.patch
          sh -n MySQL/Group-Replication/mysql_gr_migrate.sh
          ! grep -En '\b(python|python3|perl|jq|yum|dnf|apt|pip|npm)\b' MySQL/Group-Replication/mysql_gr_migrate.sh
          grep -q '^VERSION=1.0.15$' MySQL/Group-Replication/mysql_gr_migrate.sh
      - name: Commit result and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gr-v1015-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'GR v1.0.15 writeability and InnoDB Cluster safety guards'
          git push origin HEAD:main
