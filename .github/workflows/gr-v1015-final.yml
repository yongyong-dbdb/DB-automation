name: Apply GR v1.0.15 safety patch
on:
  push:
    paths:
      - '.github/workflows/gr-v1015-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/gr-v1015.patch
          git apply .github/gr-v1015.patch
          sh -n MySQL/Group-Replication/mysql_gr_migrate.sh
          test "$(grep -c '^VERSION=1.0.15$' MySQL/Group-Replication/mysql_gr_migrate.sh)" -eq 1
          if grep -En '\b(python|python3|perl|jq|yum|dnf|apt|pip|npm)\b' MySQL/Group-Replication/mysql_gr_migrate.sh; then
            echo 'Forbidden dependency found' >&2
            exit 1
          fi
      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/gr-v1015.patch .github/workflows/gr-v1015-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'GR v1.0.15 writeability and InnoDB Cluster safety guards'
          git push origin HEAD:main
