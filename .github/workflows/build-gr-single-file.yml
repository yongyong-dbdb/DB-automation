name: Build self-contained GR script

on:
  push:
    paths:
      - 'MySQL/Group-Replication/mysql_gr_migrate.sh'
      - 'MySQL/Group-Replication/mysql_gr_migrate_core_v1.0.2.sh'
      - '.github/workflows/build-gr-single-file.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate single-file script
        shell: bash
        run: |
          set -euo pipefail
          d='MySQL/Group-Replication'
          core="$d/mysql_gr_migrate_core_v1.0.2.sh"
          wrapper="$d/mysql_gr_migrate.sh"
          out="$d/mysql_gr_migrate.sh.new"

          test -f "$core"
          test -f "$wrapper"

          sed \
            -e 's/^# mysql_gr_migrate.sh v1\.0\.2$/# mysql_gr_migrate.sh v1.0.4/' \
            -e 's/^VERSION=1\.0\.2$/VERSION=1.0.4/' \
            -e '/^if \[ "${MYSQL_GR_LIB_ONLY:-0}" != 1 \]; then main; fi$/d' \
            "$core" > "$out"

          printf '\n# v1.0.4: automatic discovery/configuration overrides.\n' >> "$out"
          sed -n '/^safe_host()/,$p' "$wrapper" | sed '$d' >> "$out"
          printf '\nmain\n' >> "$out"
          mv "$out" "$wrapper"

          sh -n "$wrapper"
          test "$(sh "$wrapper" --version)" = '1.0.4'
          ! grep -q 'mysql_gr_migrate_core_v1.0.2.sh' "$wrapper"
          ! grep -Eq '(^|[[:space:]])(python|python3|perl|jq)([[:space:]]|$)' "$wrapper"

          git rm "$core"
          git add "$wrapper"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mysql): make GR migration script self-contained v1.0.4'
          git push
