name: Comprehensive PostgreSQL role switch safety patch

on:
  push:
    paths:
      - '.github/workflows/fix-sync-standby-names.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply comprehensive patch
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          python3 .github/patches/fix-sync-standby-names.py
          sh -n "$target"
          git diff --check
      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          target='PostgreSQL/postgresql_role_switch_v0.1.22.sh'
          grep -F 'Hot Standby Shared Memory' "$target"
          grep -F 'validate_replication_slot_name' "$target"
          grep -F 'physical_active' "$target"
          grep -F "must be exactly 'shut down'" "$target"
          grep -F 'Could not determine the selected Standby Server replay wait timeout before Primary shutdown.' "$target"
          ! grep -F 'remote_wait_default=$(remote_invoke' "$target"
          ! grep -F 'promote_result=$(remote_invoke' "$target"
          ! grep -F 'new_primary_sees_old=$(remote_invoke' "$target"
          ! grep -F 'css_line=$(remote_invoke' "$target"
          ! grep -F 'css_slot_state=$(remote_invoke' "$target"
          ! grep -F 'lrsp_result=$(remote_invoke' "$target"
          ! grep -F '*"shut down"*' "$target"
          ! grep -E '(^|[^[:alnum:]_])(python|python3|jq|yq|expect|perl|node|npm|pip)([^[:alnum:]_]|$)' "$target"
      - name: Mock edge cases
        shell: bash
        run: |
          set -euo pipefail
          trim() { printf '%s' "$1" | sed 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//'; }
          test -z "$(trim '')"
          test -z "$(trim '   ')"
          test -z "$(trim $'\r')"
          test "$(trim $'  ANY 2 (standby1, standby2)\r')" = 'ANY 2 (standby1, standby2)'
          valid_slot() { case "$1" in ''|*[!a-z0-9_]*) return 1 ;; *) return 0 ;; esac; }
          valid_slot 'former_primary_slot'
          ! valid_slot 'Former-Primary'
          ! valid_slot ''
          state='shut down'; test "$state" = 'shut down'
          state='shut down in recovery'; test "$state" != 'shut down'
      - name: Commit target and remove temporary patch infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/patches/fix-sync-standby-names.py
          rm -f .github/patches/trigger-role-switch-all-ssh-guards.txt
          rm -f .github/workflows/patch-postgresql-role-switch-all-ssh-guards.yml
          rm -f .github/workflows/fix-sync-standby-names.yml
          git add -A PostgreSQL/postgresql_role_switch_v0.1.22.sh .github
          git diff --cached --check
          git commit -m 'fix: harden PostgreSQL role switch safety path'
          git push origin HEAD:main
