name: Apply validated InnoDB Cluster v1.0.17
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/ic-v1017-final.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh')
          s=p.read_text()
          s=s.replace('# mysql_innodb_cluster_migrate.sh v1.0.16','# mysql_innodb_cluster_migrate.sh v1.0.17',1)
          s=s.replace('VERSION=1.0.16','VERSION=1.0.17',1)
          start=s.index('show_existing_admin_candidates(){')
          end=s.index('\nrecommended_admin_host_pattern(){', start)
          func=r'''show_existing_admin_candidates(){
    out="$ROOT/existing_admin_candidates.txt"
    accounts="$TMP/existing_accounts.tsv"
    : > "$out"
    sql 1 "SELECT User,Host FROM mysql.user WHERE User<>'' AND User NOT IN ('mysql.infoschema','mysql.session','mysql.sys') ORDER BY User,Host;" > "$accounts"
    log 'Existing AdminAPI account candidates:'
    log '  Candidate = identical user@host exists on every registered node.'
    log '  SHOW GRANTS is informational only; final acceptance always uses dba.checkInstanceConfiguration() on every node.'
    found=0
    tab=$(printf '\t')
    while IFS="$tab" read -r u h; do
        [ -n "$u" ] && [ -n "$h" ] || continue
        all=yes
        for i in $(ids); do
            c=$(sql "$i" "SELECT COUNT(*) FROM mysql.user WHERE User='$(q "$u")' AND Host='$(q "$h")';")
            [ "$c" -eq 1 ] || { all=no; break; }
        done
        [ "$all" = yes ] || continue
        found=$((found+1))
        printf '  %s@%s\n' "$u" "$h" >> "$out"
        grants=$(sql 1 "SHOW GRANTS FOR '$(q "$u")'@'$(q "$h")';" 2>/dev/null | tr '\n' '; ' || printf '')
        [ -n "$grants" ] || grants='(SHOW GRANTS unavailable or role-based; final AdminAPI validation still required)'
        printf '    grants: %s\n' "$grants" >> "$out"
    done < "$accounts"
    [ "$found" -gt 0 ] || printf '  (no identical user@host account exists on every registered node)\n' >> "$out"
    cat "$out" >&2
}
'''
          s=s[:start]+func+s[end:]
          old='''        password)\n            u=$(ask "Node $i bootstrap admin user" 'root')\n            h=$(ask "Node $i connection host/IP" '127.0.0.1')\n            p=$(ask "Node $i SQL port" '3306')\n            put "$i" auth_mode password; put "$i" user "$u"; put "$i" host "$h"; put "$i" port "$p"\n            ;;'''
          new='''        password)\n            u=$(ask "Node $i bootstrap admin user" 'root')\n            h=$(ask "Node $i connection host/IP" "${MYSQL_HOST:-}")\n            [ -n "$h" ] || die "Node $i connection host/IP is required when password authentication is used"\n            p=$(ask "Node $i SQL port" "${MYSQL_TCP_PORT:-}")\n            case $p in ''|*[!0-9]*) die "Node $i SQL port must be entered as a number";; esac\n            put "$i" auth_mode password; put "$i" user "$u"; put "$i" host "$h"; put "$i" port "$p"\n            ;;'''
          if old not in s: raise SystemExit('password block missing')
          s=s.replace(old,new,1)
          old2='''    # AdminAPI must use an address reachable by every member. Runtime GR MEMBER_HOST is preferred for existing GR.\n    connect_host=$(ask "Node $i member-reachable host/IP for AdminAPI" '127.0.0.1')\n    put "$i" uuid "$uuid"; put "$i" version "$ver"; put "$i" runtime_port "$port"; put "$i" runtime_host "$host"; put "$i" connect_host "$connect_host"'''
          new2='''    # AdminAPI must use an address reachable by every member. Prefer the live GR MEMBER_HOST, then report_host, then the explicit bootstrap host.\n    detected_member_host=$(sql "$i" "SELECT COALESCE((SELECT MEMBER_HOST FROM performance_schema.replication_group_members WHERE MEMBER_ID='$(q "$uuid")' LIMIT 1),'');")\n    if [ -z "$detected_member_host" ]; then detected_member_host=$(sql "$i" "SELECT COALESCE(@@report_host,'');"); fi\n    if [ -z "$detected_member_host" ] && [ "$(get "$i" auth_mode)" = password ]; then detected_member_host=$(get "$i" host); fi\n    connect_host=$(ask "Node $i member-reachable host/IP for AdminAPI" "$detected_member_host")\n    [ -n "$connect_host" ] || die "Node $i AdminAPI reachable host/IP could not be auto-detected; enter it explicitly"\n    put "$i" uuid "$uuid"; put "$i" version "$ver"; put "$i" runtime_port "$port"; put "$i" runtime_host "$host"; put "$i" connect_host "$connect_host"'''
          if old2 not in s: raise SystemExit('connect host block missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          f=MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          sh -n "$f"
          grep -q '^VERSION=1.0.17$' "$f"
          ! grep -Eq '(^|[[:space:];|&])(yum|dnf|apt|apt-get|pip|npm|python|python3|perl|jq)([[:space:]]|$)' "$f"
          ! grep -Eq '128\.10\.50\.221|3306|3307|3308|63132|63133|63134' "$f"
      - name: Commit and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/ic-v1017-final.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'InnoDB Cluster v1.0.17 validated admin flow fixes'
          git push origin HEAD:main
