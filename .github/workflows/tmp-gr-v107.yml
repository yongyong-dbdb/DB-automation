name: Temporary MySQL GR v1.0.7 update
# retry: 2
on:
  push:
    paths:
      - '.github/workflows/tmp-gr-v107.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate v1.0.7
        shell: bash
        run: |
          python3 .github/tmp_patch_gr_v107.py
          target='MySQL/Group-Replication/mysql_gr_migrate.sh'
          sh -n "$target"
          test "$(sh "$target" --version)" = '1.0.7'
          grep -Fq 'BINARY_LOG_BYTES_TO_SCAN' "$target"
          grep -Fq 'shell_quote "--include-gtids=$include_gtids"' "$target"
          grep -Fq 'binary-log I/O/network reads may occur' "$target"
          ! grep -Fq 'RESET BINARY LOGS AND GTIDS;' "$target"
          ! grep -E 'mysqlbinlog[^|]*\|[[:space:]]*mysql([[:space:]]|$)' "$target"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git rm .github/workflows/tmp-gr-v107.yml .github/tmp_patch_gr_v107.py
          git commit -m 'MySQL GR v1.0.7: harden read-only divergence inspection'
          git push origin HEAD:main
