name: Apply InnoDB Cluster v1.0.18 configureInstance fix
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/ic-v1018-configureinstance.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh')
          s=p.read_text()
          s=s.replace('# mysql_innodb_cluster_migrate.sh v1.0.17','# mysql_innodb_cluster_migrate.sh v1.0.18',1)
          s=s.replace('VERSION=1.0.17','VERSION=1.0.18',1)
          s=s.replace('dba.configureInstance(opts);','dba.configureInstance(undefined,opts);',1)
          old='''            for i in $(ids); do\n                exists=$(sql "$i" "SELECT COUNT(*) FROM mysql.user WHERE User='$(q "$au")' AND Host='$(q "$ah")';")\n                [ "$exists" -eq 0 ] || die "Node $i already has '$au'@'$ah'; choose existing or another account."\n            done\n'''
          new='''            existing_nodes=''\n            existing_count=0\n            for i in $(ids); do\n                exists=$(sql "$i" "SELECT COUNT(*) FROM mysql.user WHERE User='$(q "$au")' AND Host='$(q "$ah")';")\n                if [ "$exists" -gt 0 ]; then\n                    existing_count=$((existing_count+1))\n                    existing_nodes="${existing_nodes}${existing_nodes:+,}$i"\n                fi\n            done\n            total_nodes=$(get meta count)\n            if [ "$existing_count" -eq "$total_nodes" ]; then\n                die "'$au'@'$ah' already exists on every registered node. Re-run configure-admin and choose existing; the script will validate it without broadening privileges."\n            fi\n            if [ "$existing_count" -gt 0 ]; then\n                die "'$au'@'$ah' exists only on node(s) $existing_nodes. Account state is inconsistent; no CREATE/ALTER/GRANT was attempted. Review the partial account state before retrying."\n            fi\n'''
          if old not in s: raise SystemExit('existence block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          sh -n MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q '^VERSION=1.0.18$' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          grep -q 'dba.configureInstance(undefined,opts);' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
          ! grep -Eq '(^|[[:space:];|&])(yum|dnf|apt|apt-get|pip|npm)([[:space:]]|$)' MySQL/InnoDB-Cluster/mysql_innodb_cluster_migrate.sh
      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/ic-v1018-configureinstance.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'InnoDB Cluster v1.0.18 configureInstance account safety fix'
          git push origin HEAD:main
